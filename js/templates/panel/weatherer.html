<div class="panel panel-default">
    <div class="panel-heading toggle-panel">
        <span>Oil Weathering</span>
        {% if (valid_check === 'invalid') { %}
            <div class="valid-weathering invalid" title="Model weathering is missing key components and simulation will not run. Click to manually disable weathering."></div>
        {% } %}
        {% if (manual_on) { %}
            <div class="weathering-control manual" title="Some weatherer activation is under manual control. Click to reset."></div>
        {% } %}
        <div class="add" title="Edit Weatherers"></div>
    </div>
    <div class="panel-body">
        <div class="row">
            <div class="col-sm-8">
                <label name="weathering-toggle">
                {% if(!weathering_off){ %}
                    <input type="checkbox" id="weathering-toggle" checked="checked">
                {% } else { %}
                    <input type="checkbox" id="weathering-toggle">
                {% } %} Enable Weathering
                </label>
            </div>
        </div>
        
        <div class="row weatherer-select">
            <select name="winds" class="form-control" id="available-winds">
                {% if(windMovers.length === 0){ %}
                    <option value="">No Wind Available</option>
                {% } else { %}
                    {% for (var i = 0; i < windMovers.length; i++){ %}
                        <option value="{{ windMovers[i].get('id') }}" 
                            {% if(wind_name === windMovers[i].get('name')){ %}
                                selected="selected"
                            {% } %}>
                            {{ windMovers[i].get('name') }}
                        </option>
                    {% } %}
                {% } %}
            </select>
        </div>
<!--
            {% for (var i = 0; i < weatherers.length; i++){ %}
                <div class="single row" data-id="{{ weatherers[i].get('id') }}">
                    {% var name = weatherers[i].get('name'); %}
                    <div class="col-sm-8">
                        <label>
                        {% if(weatherers[i].get('on')){ %}
                            <input type="checkbox" name="active" value="1" id="active" checked="checked"> {{ name }}
                        {% } else { %}
                            <input type="checkbox" name="active" value="1" id="active"> {{ name }}
                        {% } %} </label>
                    </div>
                    {% if(weatherers[i].get('wind')){ %}
                    <div class="col-sm-2">
                        <span class="label label-info">{{ weatherers[i].get('wind').get('name') }}</span>
                    </div>
                    {% } %}
                </div>
            {% } %}
-->
        </div>
	</div>
</div>
