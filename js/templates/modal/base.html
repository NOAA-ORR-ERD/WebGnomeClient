<div class="modal-dialog modal-{{size}}">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close">&times;</button>
            <h4>{# title}}</h4>
        </div>
        <div class="modal-body">
            {# body }}
        </div>
        <div class="modal-footer">
            {# buttons }}
        </div>
    </div>
</div>
