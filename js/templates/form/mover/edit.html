
    
<div class="panel panel-default complete">

        <div class="panel-heading">
            <div class="panel-title"> Mover data availability</div>
        </div>
        <div class="panel-body">
            <div class="row">
                <div class="col-sm-4">
                    &nbsp
                </div>
                <div class="col-sm-4">
                    <strong>UTC (assumed)</strong>
                </div>

             </div>
             <div class="row">               
                <div class="col-sm-4">
                    <strong>Start date:</strong>
                </div>
                <div class="col-sm-4">
                    {{start_time}}
                </div>
             </div>
             <div class="row">
                <div class="col-sm-4">
                    <strong>End date:</strong>
                </div>
                <div class="col-sm-4">
                    {{end_time}}
                </div>
             </div>             
       </div>
</div>

<form class="form-horizontal" role="form">    
	<div class="form-group">
        <label class="col-sm-4 control-label" for="mover_name">Name:</label>
        <div class="col-sm-5">
            <input type="text" id="mover_name" class="form-control" name="name" value="{{ name }}">
        </div>
    </div>

    
    <div class="form-group">
      <label class="col-sm-4 control-label" for="tshift">Adjust Mover to Model Timezone:</label>
      <div class="col-sm-2">
            <label class="checkbox-inline">
                <input type="checkbox" name="tshift" value="0" id="tshift" checked="checked">&nbsp;
            </label>
        </div>
        <div class="col-sm-5">
        <span id="tzone" class="label label-info pull-right"> {{tzone}}</span>
        </div>  

    </div>
    
    <div class="form-group">
        <label class="col-sm-4 control-label" for="set_active_range">Active Range:</label>
        <div class="col-sm-5">
            <select class="form-control" id="set_active_range">
                <option value="infinite">Infinite</option>
                <option value="data_range">Set Start/End Times</option>
            </select>
        </div>
   
        <div class="active_range hide">
            <label class="col-sm-4 control-label">Start:</label>
            <div class="col-sm-5">
                <input type="text" id="active_start" class="form-control" name="active_start" value="{{ active_start }}">
            </div>
            <label class="col-sm-4 control-label">Stop:</label>
            <div class="col-sm-5">
                <input type="text" id="active_stop" class="form-control" name="active_stop" value="{{ active_stop }}">
            </div>  
        </div>
   </div>
    
    <div class="form-group">
        <label class="col-sm-4 control-label" for="scale_value">Scale Value:</label>
        <div class="col-sm-5">
            <input type="number" class="form-control allow_neg" name="scale_value" value="{{ scale_value }}" id="scale_value">
        </div>
    </div>
    
    <div class="form-group">
        <label class="col-sm-4 control-label" for="extrapolation-allowed">Extrapolate:</label>
        <div class="col-sm-5">
            <label class="checkbox-inline">
            {% if (extrapolation_is_allowed) { %}
            <input type="checkbox" name="extrapolation-allowed" value="1" id="extrapolation-allowed" checked="checked">&nbsp;
            {% } else { %}
            <input type="checkbox" name="extrapolation-allowed" value="1" id="extrapolation-allowed">&nbsp;
            {% } %}
            </label>
        </div>
   </div>

</form>
