stages:
  - build
  - test
  - deploy

build docker image:
  stage: build
  image: registry.orr.noaa.gov/internal-container-registry/dnd-image-builder/dnd-image-builder-new
  tags:
    - docker
  before_script:
    - unset DOCKER_AUTH_CONFIG
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - >
      docker build -f dockerfile -t
      registry.orr.noaa.gov/gnome/webgnomeclient:$CI_COMMIT_REF_NAME
    - docker push registry.orr.noaa.gov/gnome/webgnomeclient:$CI_COMMIT_REF_NAME

Rebuild API:
  stage: deploy
  when: manual
  trigger:
    project: gnome/webgnomeapi
    branch: main
    strategy: depend
  variables:
    WEBGNOME_CLIENT_VER: $CI_COMMIT_REF_NAME
