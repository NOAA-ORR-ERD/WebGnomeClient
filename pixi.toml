[workspace]
authors = ["Chris Barker <Chris.Barker@noaa.gov>"]
channels = ["conda-forge"]
name = "webgnome_docs"
platforms = ["osx-64", "win-64", "linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
build_docs = "cd doc/ && sphinx-build -b html ./ ../dist/build/doc"

[dependencies]
sphinx = ">7.2"  # for compatibility with sphinx_rtd_theme
sphinx_rtd_theme = ">=3.0"
sphinx-design = "*"
sphinxcontrib-jquery = "*"

